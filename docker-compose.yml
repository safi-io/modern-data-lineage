version: '3.8'

services:

  spark:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu
    container_name: spark
    user: root
    environment:
      - SPARK_MODE=master
    command: >
      /bin/bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark-apps:/opt/spark-apps
    env_file:
      - .env

  spark-worker:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu
    container_name: spark-worker
    user: root
    depends_on:
      - spark
    environment:
      - SPARK_MODE=worker0
    command: >
      /bin/bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077"
    ports:
      - "8082:8081"
    volumes:
      - ./spark-apps:/opt/spark-apps
    env_file:
      - .env

  dagster-db:
    image: postgres:16
    container_name: dagster-db
    volumes:
      - dagster_db_data:/var/lib/postgresql/data
      - ./docker/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  webserver:
    build:
      context: ./dagster
      dockerfile: Dockerfile
    container_name: dagster-webserver
    volumes:
      - ./dagster:/opt/dagster/app/
      - ./dbt:/opt/dagster/dbt
      - ./data:/opt/dagster/data/
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dbt/modern_data_lineage/dbt:/root/.dbt
    ports:
      - "3000:3000"
    depends_on:
      dagster-db:
        condition: service_healthy
      daemon:
        condition: service_started
    command: dagit -h 0.0.0.0 -p 3000 -w /opt/dagster/app/workspace.yaml
    env_file:
      - .env

  daemon:
    build:
      context: ./dagster
      dockerfile: Dockerfile
    container_name: dagster-daemon
    volumes:
      - ./dagster:/opt/dagster/app/
      - ./dbt:/opt/dagster/dbt
      - ./data:/opt/dagster/data/
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dbt/modern_data_lineage/dbt:/root/.dbt
    depends_on:
      dagster-db:
        condition: service_healthy
    command: dagster-daemon run
    env_file:
      - .env

  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    env_file:
      - .env

  nessie:
    image: ghcr.io/projectnessie/nessie
    container_name: nessie
    ports:
      - "19120:19120"
    volumes:
      - nessie_data:/data
    env_file:
      - .env

  trino:
    image: trinodb/trino
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - minio
      - nessie
    env_file:
      - .env   

  superset:
    image: apache/superset:3.1.1
    container_name: superset
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./docker/superset-init.sh:/app/superset-init.sh
    entrypoint: ["/bin/sh", "/app/superset-init.sh"]
    env_file:
      - .env
    depends_on:
      - trino
      
volumes: 
  dagster_db_data:
  app_db_data:
  superset_home:
  minio_data:
  nessie_data: